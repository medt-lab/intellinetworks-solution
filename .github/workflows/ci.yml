name: CI

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}   

      - name: Build Docker image
        run: docker build -t thm63/intellinetworks-solution:ci .

      - name: Run Docker container
        run: docker run -d --name intellinetworks-ci -p 8080:80 thm63/intellinetworks-solution:ci

      - name: Wait for website
        run: sleep 3

      - name: Test website
        run: curl -f http://localhost:8080

      - name: Push image to Docker Hub
        run: docker push thm63/intellinetworks-solution:ci
